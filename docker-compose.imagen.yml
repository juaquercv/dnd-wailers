# D&D Wailers — jugar SIN compilar, usando la imagen ya publicada en GitHub.
#
# 1. Instala Docker Desktop y ábrelo.
# 2. Guarda este archivo en una carpeta vacía (por ejemplo "dnd-wailers").
# 3. En esa carpeta ejecuta:   docker compose -f docker-compose.imagen.yml up -d
# 4. Abre http://localhost:8080  (en la red local: http://<IP de tu equipo>:8080)
#
# Actualizar a la última versión:
#   docker compose -f docker-compose.imagen.yml pull
#   docker compose -f docker-compose.imagen.yml up -d
#
# Opcional: crea un archivo .env junto a este para cambiar APP_PORT, contraseñas, etc.
name: dnd-wailers

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wailers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wailers}
      POSTGRES_DB: ${POSTGRES_DB:-wailers}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    image: ghcr.io/juaquercv/dnd-wailers:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wailers}:${POSTGRES_PASSWORD:-wailers}@db:5432/${POSTGRES_DB:-wailers}?schema=public
      USER_RELEASE_SECONDS: ${USER_RELEASE_SECONDS:-60}
      APP_PORT: ${APP_PORT:-8080}
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:3000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db-data:
  uploads:
